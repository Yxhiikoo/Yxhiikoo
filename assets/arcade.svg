<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d0640"/>
      <stop offset="0.6" stop-color="#07010f"/>
      <stop offset="1" stop-color="#12052a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="0.5" stop-color="#E100FF"/>
      <stop offset="1" stop-color="#FFD23F"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE600"/>
      <stop offset="0.5" stop-color="#FF2E97"/>
      <stop offset="1" stop-color="#7F00FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="860" height="280" rx="18"/></clipPath>
    <clipPath id="floor"><rect x="0" y="170" width="860" height="110"/></clipPath>
    <style>
      .t { font-family: 'Press Start 2P', 'Courier New', monospace; font-weight: 900; }
      .h { stroke: #E100FF; stroke-width: 1.5; opacity: .55; }
      .mv { animation: mv 1s linear infinite; }
      @keyframes mv { from { transform: translateY(0); } to { transform: translateY(22px); } }
      .pulse { animation: pulse 1.2s ease-in-out infinite; transform-origin: 430px 226px; }
      @keyframes pulse { 50% { transform: scale(1.07); } }
      .blink { animation: blink 1s steps(2) infinite; }
      .blink2 { animation: blink 1s steps(2) infinite .5s; }
      @keyframes blink { 50% { opacity: .15; } }
      .flick { animation: flick 4s infinite; }
      @keyframes flick { 0%, 90%, 100% { opacity: 1; } 92% { opacity: .4; } 94% { opacity: 1; } 96% { opacity: .6; } }
      .float { animation: float 2.4s ease-in-out infinite; }
      .float2 { animation: float 2.4s ease-in-out infinite 1.2s; }
      @keyframes float { 50% { transform: translateY(-8px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="860" height="280" fill="url(#bg)"/>

    <!-- étoiles -->
    <g fill="#fff">
      <circle cx="60" cy="30" r="1.2" class="blink"/><circle cx="140" cy="70" r="1"/><circle cx="220" cy="22" r="1.4" class="blink2"/>
      <circle cx="330" cy="50" r="1"/><circle cx="560" cy="28" r="1.3" class="blink"/><circle cx="640" cy="64" r="1"/>
      <circle cx="720" cy="20" r="1.2" class="blink2"/><circle cx="800" cy="58" r="1"/><circle cx="470" cy="14" r="1"/>
    </g>

    <!-- soleil synthwave -->
    <g opacity=".85">
      <circle cx="430" cy="170" r="78" fill="url(#sun)"/>
      <g fill="#07010f">
        <rect x="340" y="132" width="180" height="3"/><rect x="340" y="144" width="180" height="4"/>
        <rect x="340" y="156" width="180" height="5"/><rect x="340" y="166" width="180" height="6"/>
      </g>
    </g>

    <!-- sol en perspective -->
    <rect x="0" y="170" width="860" height="110" fill="#0a0018"/>
    <g clip-path="url(#floor)">
      <g class="h">
        <line x1="430" y1="170" x2="-400" y2="280"/><line x1="430" y1="170" x2="-150" y2="280"/>
        <line x1="430" y1="170" x2="100" y2="280"/><line x1="430" y1="170" x2="300" y2="280"/>
        <line x1="430" y1="170" x2="430" y2="280"/><line x1="430" y1="170" x2="560" y2="280"/>
        <line x1="430" y1="170" x2="760" y2="280"/><line x1="430" y1="170" x2="1010" y2="280"/>
        <line x1="430" y1="170" x2="1260" y2="280"/>
      </g>
      <g class="mv">
        <g class="h">
          <line x1="0" y1="152" x2="860" y2="152"/><line x1="0" y1="174" x2="860" y2="174"/>
          <line x1="0" y1="196" x2="860" y2="196"/><line x1="0" y1="218" x2="860" y2="218"/>
          <line x1="0" y1="240" x2="860" y2="240"/><line x1="0" y1="262" x2="860" y2="262"/>
          <line x1="0" y1="284" x2="860" y2="284"/>
        </g>
      </g>
    </g>
    <line x1="0" y1="170" x2="860" y2="170" stroke="#00D4FF" stroke-width="2" filter="url(#glow)"/>

    <!-- icônes flottantes -->
    <g font-size="38" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">
      <text x="70" y="150" class="float">🏃</text>
      <text x="170" y="120" class="float2">🎰</text>
      <text x="640" y="120" class="float">🃏</text>
      <text x="740" y="150" class="float2">🎡</text>
    </g>

    <!-- titre -->
    <g class="flick" filter="url(#glow)">
      <text x="430" y="78" text-anchor="middle" class="t" font-size="44" fill="url(#title)">GABRIEL ARCADE</text>
    </g>
    <text x="430" y="110" text-anchor="middle" class="t" font-size="13" fill="#00D4FF" filter="url(#glow)">NEON RUN 3D · MACHINE À SOUS · BLACKJACK · ROULETTE 3D</text>

    <!-- bouton -->
    <g class="pulse">
      <rect x="320" y="200" width="220" height="52" rx="10" fill="#1a0533" stroke="#E100FF" stroke-width="3" filter="url(#glow)"/>
      <text x="430" y="234" text-anchor="middle" class="t" font-size="22" fill="#fff" filter="url(#glow)">▶ JOUER</text>
    </g>

    <!-- ampoules -->
    <g fill="#FFD23F">
      <circle cx="30" cy="250" r="4" class="blink"/><circle cx="55" cy="250" r="4" class="blink2"/><circle cx="80" cy="250" r="4" class="blink"/>
      <circle cx="780" cy="250" r="4" class="blink2"/><circle cx="805" cy="250" r="4" class="blink"/><circle cx="830" cy="250" r="4" class="blink2"/>
    </g>
  </g>
  <rect x="1.5" y="1.5" width="857" height="277" rx="17" fill="none" stroke="#7F00FF" stroke-width="3"/>
</svg>
