name: Serpent et salle d'arcade

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/arcade.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,galaga,breakout"

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E100FF&color_dots=#ebedf0,#e0b3ff,#c266ff,#9f1aff,#7F00FF
            dist/snake-dark.svg?palette=github-dark&color_snake=#00D4FF&color_dots=#161b22,#3b0066,#6a00b3,#a100ff,#E100FF

      - run: ls -la dist

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
